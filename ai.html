<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-435XG5B8ZM"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skrypt — AI</title>
    <link rel="icon" type="image/png" href="/images/gc.png">
    <meta name="description" content="Skrypt AI — Powered by CeloAI.">
    <meta name="keywords" content="Skrypt, AI, CeloAI, Chatbot">
    <meta name="author" content="Skrypt">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="theme-loader.js"></script>
    <link rel="stylesheet" href="styles/index.css">

    <style>
        .ai-page { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; padding: 1rem 1.5rem; gap: 1rem; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding-bottom: 1rem; }
        .message { display: flex; gap: 0.75rem; max-width: 85%; animation: fadeIn 0.3s ease; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }
        .message-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 700; }
        .message.user .message-avatar { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
        .message.assistant .message-avatar { background: linear-gradient(135deg, #10b981, #06b6d4); color: white; }
        .message-bubble { padding: 0.85rem 1.1rem; border-radius: 16px; font-family: 'Inter', sans-serif; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .message.user .message-bubble { background: linear-gradient(135deg, #3b82f6, #6366f1); color: white; border-bottom-right-radius: 4px; }
        .message.assistant .message-bubble { background: rgba(255,255,255,0.06); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }
        .chat-input-area { display: flex; gap: 0.75rem; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; backdrop-filter: blur(10px); }
        .chat-input { flex: 1; background: transparent; border: none; outline: none; color: #f1f5f9; font-family: 'Inter', sans-serif; font-size: 0.95rem; resize: none; max-height: 120px; }
        .chat-input::placeholder { color: rgba(255,255,255,0.3); }
        .send-btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: none; border-radius: 12px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; transition: transform 0.2s, opacity 0.2s; flex-shrink: 0; }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .typing-indicator { display: flex; gap: 4px; padding: 1rem 1.1rem; }
        .typing-indicator span { width: 8px; height: 8px; background: rgba(255,255,255,0.4); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .welcome-msg { text-align: center; padding: 3rem 1rem; opacity: 0.5; }
        .welcome-msg h3 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin-bottom: 0.5rem; }
        .welcome-msg p { font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <img src="imgs/logo.png" alt="logo" height="50" width="50" style="border-radius: 20px;">
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-label="Home"><i data-lucide="home"></i></a></li>
            <li><a href="games.html" data-label="Games"><i data-lucide="gamepad-2"></i></a></li>
            <li><a href="apps.html" data-label="Apps"><i data-lucide="layers"></i></a></li>
            <li><a href="music" data-label="Music"><i data-lucide="music-4"></i></a></li>
            <li><a href="Ai.html" data-label="AI" class="active"><i data-lucide="bot"></i></a></li>
            <li><div class="nav-divider"></div></li>
            <li><a href="chat" data-label="Chat" target="_blank"><i data-lucide="message-square"></i></a></li>
            <li><a href="partners" data-label="Partners"><i data-lucide="handshake"></i></a></li>
            <li><a href="extra" data-label="Extra"><i data-lucide="more-horizontal"></i></a></li>
            <li><a href="settings" data-label="Settings"><i data-lucide="settings"></i></a></li>
        </ul>
    </aside>

    <main class="main ai-page">
        <div class="hero" style="padding: 2rem 0 1rem;">
            <div class="hero-badge"><span class="pulse"></span>CeloAI Powered</div>
            <h1>Skrypt AI</h1>
            <p>Ask anything — powered by Llama 3.3 70B</p>
        </div>

        <div class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-msg">
                    <i data-lucide="bot" style="width: 40px; height: 40px; margin-bottom: 1rem;"></i>
                    <h3>Skrypt AI</h3>
                    <p>Start a conversation below.</p>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea class="chat-input" id="user-input" placeholder="Type your message..." rows="1"></textarea>
                <button class="send-btn" id="send-btn"><i data-lucide="arrow-up" style="width: 20px; height: 20px;"></i></button>
            </div>
        </div>
    </main>

    <script>
        // Your CeloAI key
        const CELOAI_API_KEY = "celo_mJMOgsBaWssDahuL9TZ1hJijexpexozQIlZJKOxzT9s";

        // CORS proxy routes the request so the browser allows it
        const CELOAI_CONFIG = {
            endpoint: "https://corsproxy.io/?https://api.celoai.org/api/celo/v1/chat/completions",
            model: "llama-3.3-70b-versatile",
            maxTokens: 2048,
            temperature: 0.7
        };

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let messageHistory = [{
            role: "system",
            content: "You are Skrypt AI, a helpful assistant for the Skrypt gaming hub. Keep responses concise but informative."
        }];

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage("user", text);
            userInput.value = '';
            userInput.style.height = 'auto';
            messageHistory.push({ role: "user", content: text });
            showTyping();
            sendBtn.disabled = true;
            userInput.disabled = true;

            try {
                const response = await fetch(CELOAI_CONFIG.endpoint, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${CELOAI_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: CELOAI_CONFIG.model,
                        messages: messageHistory,
                        max_tokens: CELOAI_CONFIG.maxTokens,
                        temperature: CELOAI_CONFIG.temperature
                    })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;
                messageHistory.push({ role: "assistant", content: reply });
                removeTyping();
                addMessage("assistant", reply);

            } catch (error) {
                removeTyping();
                addMessage("assistant", `❌ Error\n\n${error.message}`);
                console.error("CeloAI Error:", error);
            } finally {
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(role, text) {
            const welcome = chatMessages.querySelector('.welcome-msg');
            if (welcome) welcome.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'YOU' : 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant typing';
            div.id = 'typing-indicator';
            div.innerHTML = `<div class="message-avatar">AI</div><div class="message-bubble typing-indicator"><span></span><span></span><span></span></div>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const t = document.getElementById('typing-indicator');
            if (t) t.remove();
        }

        lucide.createIcons();
    </script>
</body>
</html>
